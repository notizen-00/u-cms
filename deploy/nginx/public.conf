server {
    listen 80;
    server_name _;
    root /sites;

    # Baseline security headers for every published site, regardless of
    # theme. `always` sends them on error responses (404s) too, not just 2xx.
    # No Content-Security-Policy here: it broke legitimate site content
    # (external hero videos/images, theme fonts) in ways that were hard to
    # fully anticipate in advance, so it was dropped rather than kept as a
    # source of recurring false positives.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    # Harmless over plain HTTP (browsers ignore it on non-TLS responses) and
    # takes effect once this is fronted by TLS in production.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = / {
        default_type text/plain;
        return 200 "Unej CMS static preview.\nUse /{site-slug}/ to view a published site.\n";
    }

    # /{site-slug} without trailing slash -> redirect to /{site-slug}/
    # Explicit $scheme://$http_host (not a bare "/$1/", which nginx would
    # auto-prepend with $scheme://$host — $host drops a non-standard port
    # like the host-mapped 8080, redirecting browsers to port 80 instead).
    location ~ ^/([a-z0-9-]+)$ {
        return 301 $scheme://$http_host/$1/;
    }

    # Canonicalize generated directory pages before serving them. Packaged
    # plugin assets use page-relative URLs, which require the browser URL to
    # end in `/` at every nesting depth (for example `/site/news/item/`).
    # The `if` only returns and is therefore safe in a location block; regular
    # files such as CSS, JS, and images continue through to `try_files`.
    location ~ ^/([a-z0-9-]+)/(.*[^/])$ {
        set $site $1;
        set $relpath $2;
        if (-f /sites/$site/current/$relpath/index.html) {
            return 301 $scheme://$http_host/$site/$relpath/$is_args$args;
        }
        try_files /$site/current/$relpath =404;
    }

    # /{site-slug}/{...path} -> serve from the site's `current` release symlink
    location ~ ^/([a-z0-9-]+)/(.*)$ {
        set $site $1;
        set $relpath $2;
        try_files /$site/current/$relpath /$site/current/$relpath/index.html =404;
    }
}

# Domain-style access for local dev: http://{slug}.localhost:8080/ serves the
# same site as http://localhost:8080/{slug}/ but without the path prefix.
# *.localhost resolves to 127.0.0.1 in every modern browser/OS per RFC 6761 —
# no /etc/hosts edit needed. Matched by a separate server block (not folded
# into the one above) so it never competes with that block's own location
# regexes, which would otherwise treat the Host header's leftmost label as if
# it were a path segment.
server {
    listen 80;
    server_name ~^(?<site_slug>[a-z0-9-]+)\.localhost$;
    root /sites;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = / {
        try_files /$site_slug/current/index.html =404;
    }

    # Apply the same trailing-slash canonicalization for domain-style access.
    location ~ ^/(.*[^/])$ {
        set $relpath $1;
        if (-f /sites/$site_slug/current/$relpath/index.html) {
            return 301 $scheme://$http_host/$relpath/$is_args$args;
        }
        try_files /$site_slug/current/$relpath =404;
    }

    location ~ ^/(.*)$ {
        set $relpath $1;
        try_files /$site_slug/current/$relpath /$site_slug/current/$relpath/index.html =404;
    }
}
