server {
    listen 80;
    server_name _;
    root /sites;

    location = / {
        default_type text/plain;
        return 200 "Unej CMS static preview.\nUse /{site-slug}/ to view a published site.\n";
    }

    # /{site-slug} without trailing slash -> redirect to /{site-slug}/
    # Explicit $scheme://$http_host (not a bare "/$1/", which nginx would
    # auto-prepend with $scheme://$host — $host drops a non-standard port
    # like the host-mapped 8080, redirecting browsers to port 80 instead).
    location ~ ^/([a-z0-9-]+)$ {
        return 301 $scheme://$http_host/$1/;
    }

    # /{site-slug}/{...path} -> serve from the site's `current` release symlink
    location ~ ^/([a-z0-9-]+)/(.*)$ {
        set $site $1;
        set $relpath $2;
        try_files /$site/current/$relpath /$site/current/$relpath/index.html =404;
    }
}

# Domain-style access for local dev: http://{slug}.localhost:8080/ serves the
# same site as http://localhost:8080/{slug}/ but without the path prefix.
# *.localhost resolves to 127.0.0.1 in every modern browser/OS per RFC 6761 —
# no /etc/hosts edit needed. Matched by a separate server block (not folded
# into the one above) so it never competes with that block's own location
# regexes, which would otherwise treat the Host header's leftmost label as if
# it were a path segment.
server {
    listen 80;
    server_name ~^(?<site_slug>[a-z0-9-]+)\.localhost$;
    root /sites;

    location = / {
        try_files /$site_slug/current/index.html =404;
    }

    location ~ ^/(.*)$ {
        set $relpath $1;
        try_files /$site_slug/current/$relpath /$site_slug/current/$relpath/index.html =404;
    }
}
