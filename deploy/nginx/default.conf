map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# One public domain, one active static release. TLS should terminate in front
# of this container (or in a companion proxy), not in application routing.
server {
    listen 80 default_server;
    server_name _;

    # Keep `/sites` as the filesystem root and address the `current` symlink
    # explicitly. This is reliable with nginx's try_files resolution and the
    # builder's atomic releases/<id> -> current swap.
    root /sites;
    client_max_body_size 32m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /admin is an entry alias. Strip it before SvelteKit receives the request.
    location = /admin { return 308 /admin/; }
    location ^~ /admin/ {
        rewrite ^/admin/?(.*)$ /$1 break;
        proxy_pass http://dashboard:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Vite/SvelteKit emits these assets at the origin root even when the user
    # entered through /admin, so they are not public-site assets.
    location ^~ /_app/ {
        proxy_pass http://dashboard:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # The dashboard currently emits absolute route links. Reserve those paths
    # before the static-site fallback; /setup remains reachable pre-install.
    location ~ ^/(?:setup|login|logout|switch-site|sites|users|themes|account)(?:/|$) {
        proxy_pass http://dashboard:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /api { return 308 /api/; }
    location ^~ /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location = /media { return 308 /media/; }
    location ^~ /media/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Published output is the one active static site. Builder writes the home
    # page to /sites/current/index.html and every generated page to its own
    # directory's index.html. Do not test `$uri/`: that would select a
    # directory before its generated index and can produce a false 404/403.
    location = / {
        try_files /current/index.html =404;
    }

    location / {
        try_files /current$uri /current$uri/index.html =404;
    }
}
