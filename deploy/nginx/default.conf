# ============================================================================
# Unej CMS - Unified Nginx Reverse Proxy
# ============================================================================
#
# Public routing:
#
#   /admin/       -> SvelteKit dashboard
#   /api/         -> NestJS API
#   /media/       -> MinIO
#   /{site}/      -> Published static site
#
# Local domain-style development:
#
#   http://{site}.localhost:8080/
#
# ============================================================================


# ----------------------------------------------------------------------------
# WebSocket / HTTP upgrade handling
# ----------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


# ============================================================================
# MAIN SERVER
# ============================================================================
#
# Handles:
#
#   localhost:8080/admin/
#   localhost:8080/api/
#   localhost:8080/media/
#   localhost:8080/{site}/
#
# ============================================================================

server {

    listen 80;
    server_name _;

    # ------------------------------------------------------------------------
    # Static site root
    # ------------------------------------------------------------------------

    root /sites;

    # ------------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------------

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;

    # NOTE:
    # HSTS should normally only be enabled when HTTPS is actually used.
    # Uncomment this when production is behind HTTPS.
    #
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


    # =========================================================================
    # HEALTH CHECK
    # =========================================================================

    location = /health {
        access_log off;

        default_type text/plain;

        return 200 "ok\n";
    }

    location = /setup {
    return 301 /setup/;
}

location ^~ /setup/ {
    proxy_pass http://dashboard:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}

    # =========================================================================
    # ADMIN DASHBOARD
    # =========================================================================

    # /admin -> /admin/
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {

        client_max_body_size 16m;

        proxy_pass http://dashboard:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /admin;

        # WebSocket / streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }


    # =========================================================================
    # BACKEND API
    # =========================================================================

    # /api -> /api/
    location = /api {
        return 301 /api/;
    }

    location ^~ /api/ {

        # Remove /api prefix before forwarding to NestJS.
        #
        # Browser:
        #   /api/users
        #
        # Backend receives:
        #   /users

        rewrite ^/api/(?<api_path>.*)$ /$api_path break;

        proxy_pass http://api:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /api;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }


    # =========================================================================
    # MINIO / MEDIA
    # =========================================================================

    # /media -> /media/
    location = /media {
        return 301 /media/;
    }

    location ^~ /media/ {

        # Remove /media prefix before forwarding to MinIO.
        #
        # Browser:
        #   /media/unej-cms-media/image.jpg
        #
        # MinIO receives:
        #   /unej-cms-media/image.jpg

        rewrite ^/media/(?<media_path>.*)$ /$media_path break;

        proxy_pass http://minio:9000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }


    # =========================================================================
    # ROOT
    # =========================================================================

    location = / {

        default_type text/plain;

        return 200 "Unej CMS static preview.\nUse /{site-slug}/ to view a published site.\n";
    }


    # =========================================================================
    # RESERVED PREFIX PROTECTION
    # =========================================================================
    #
    # These names must never be interpreted as site slugs.
    #
    # /admin
    # /api
    # /media
    #
    # are handled above.
    #
    # The following explicit blocks make sure malformed/non-trailing-slash
    # requests don't fall through to the static-site regex locations.
    # =========================================================================

    location = /admin/ {
        proxy_pass http://dashboard:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /admin;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }


    # =========================================================================
    # PATH-BASED STATIC SITES
    # =========================================================================
    #
    # Example:
    #
    #   /faculty/
    #   /faculty/news/
    #   /faculty/news/article/
    #
    # Files are served from:
    #
    #   /sites/faculty/current/
    #
    # =========================================================================


    # -------------------------------------------------------------------------
    # /{site}
    #
    # Example:
    #
    #   /faculty
    #
    # becomes:
    #
    #   /faculty/
    #
    # IMPORTANT:
    # Uses named capture instead of $1.
    # -------------------------------------------------------------------------

    location ~ ^/(?<site_slug>[a-z0-9-]+)$ {

        # Reserved prefixes
        if ($site_slug = admin) {
            return 404;
        }

        if ($site_slug = api) {
            return 404;
        }

        if ($site_slug = media) {
            return 404;
        }

        return 301 $scheme://$http_host/$site_slug/;
    }


    # -------------------------------------------------------------------------
    # /{site}/{path}
    #
    # Canonicalize generated directory pages.
    #
    # Example:
    #
    #   /faculty/news
    #
    # becomes:
    #
    #   /faculty/news/
    #
    # if:
    #
    #   /sites/faculty/current/news/index.html
    #
    # exists.
    #
    # -------------------------------------------------------------------------

    location ~ ^/(?<site_name>[a-z0-9-]+)/(?<site_path>.+[^/])$ {

        # Reserved prefixes
        if ($site_name = admin) {
            return 404;
        }

        if ($site_name = api) {
            return 404;
        }

        if ($site_name = media) {
            return 404;
        }

        # If this path represents a generated directory page,
        # enforce trailing slash.
        if (-f /sites/$site_name/current/$site_path/index.html) {
            return 301 $scheme://$http_host/$site_name/$site_path/$is_args$args;
        }

        # Otherwise serve the actual file/path.
        try_files
            /$site_name/current/$site_path
            =404;
    }


    # -------------------------------------------------------------------------
    # /{site}/{path}
    #
    # Final static-site handler.
    #
    # Example:
    #
    #   /faculty/
    #   /faculty/assets/app.css
    #   /faculty/news/
    #
    # -------------------------------------------------------------------------

    location ~ ^/(?<static_site>[a-z0-9-]+)/(?<static_path>.*)$ {

        # Reserved prefixes
        if ($static_site = admin) {
            return 404;
        }

        if ($static_site = api) {
            return 404;
        }

        if ($static_site = media) {
            return 404;
        }

        try_files
            /$static_site/current/$static_path
            /$static_site/current/$static_path/index.html
            =404;
    }
}


# ============================================================================
# DOMAIN-STYLE LOCAL DEVELOPMENT
# ============================================================================
#
# Example:
#
#   http://faculty.localhost:8080/
#
# maps internally to:
#
#   /sites/faculty/current/
#
# Unlike path-based routing:
#
#   http://localhost:8080/faculty/
#
# ============================================================================

server {

    listen 80;

    server_name ~^(?<domain_site_slug>[a-z0-9-]+)\.localhost$;

    root /sites;

    # ------------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------------

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;

    # Enable only when using HTTPS.
    #
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


    # =========================================================================
    # ROOT OF DOMAIN SITE
    # =========================================================================

    location = / {

        try_files
            /$domain_site_slug/current/index.html
            =404;
    }


    # =========================================================================
    # DOMAIN SITE DIRECTORY PAGES
    # =========================================================================
    #
    # Example:
    #
    #   http://faculty.localhost:8080/news
    #
    # becomes:
    #
    #   http://faculty.localhost:8080/news/
    #
    # when:
    #
    #   /sites/faculty/current/news/index.html
    #
    # exists.
    #
    # =========================================================================

    location ~ ^/(?<domain_path>.+[^/])$ {

        # Reserved names are not relevant for normal *.localhost sites,
        # but keep the protection here as well.
        if ($domain_site_slug = admin) {
            return 404;
        }

        if ($domain_site_slug = api) {
            return 404;
        }

        if ($domain_site_slug = media) {
            return 404;
        }

        if (-f /sites/$domain_site_slug/current/$domain_path/index.html) {

            return 301 $scheme://$http_host/$domain_path/$is_args$args;
        }

        try_files
            /$domain_site_slug/current/$domain_path
            =404;
    }


    # =========================================================================
    # DOMAIN SITE FILES / GENERATED PAGES
    # =========================================================================

    location ~ ^/(?<domain_static_path>.*)$ {

        if ($domain_site_slug = admin) {
            return 404;
        }

        if ($domain_site_slug = api) {
            return 404;
        }

        if ($domain_site_slug = media) {
            return 404;
        }

        try_files
            /$domain_site_slug/current/$domain_static_path
            /$domain_site_slug/current/$domain_static_path/index.html
            =404;
    }
}