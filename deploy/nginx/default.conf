# Unified reverse proxy for the entire Unej CMS stack.
# Single public port with path-based routing:
#   /admin  → SvelteKit admin dashboard
#   /api    → NestJS backend API
#   /media  → MinIO public bucket access
#   /       → Published static sites
#
# Requests matching reserved prefixes are never treated as site slugs.

# Only forward Connection: upgrade when the client actually asked for one
# (real WebSocket handshake) — hardcoding "upgrade" unconditionally previously
# sent it on every plain HTTP request, which confused the SvelteKit adapter-node
# server into inconsistent per-route responses.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Health check used by docker-compose depends_on.
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # --- Admin dashboard (SvelteKit, base path /admin) -----------------------
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        client_max_body_size 16m;

        proxy_pass http://dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # --- Backend API ---------------------------------------------------------
    location = /api {
        return 301 /api/;
    }

    location ^~ /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- MinIO public bucket access ------------------------------------------
    location = /media {
        return 301 /media/;
    }

    location ^~ /media/ {
        rewrite ^/media/(.*) /$1 break;
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Published static sites (root path) ----------------------------------
    root /sites;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = / {
        default_type text/plain;
        return 200 "Unej CMS static preview.\nUse /{site-slug}/ to view a published site.\n";
    }

    # /{site-slug} without trailing slash -> redirect to /{site-slug}/
    # Explicit $scheme://$http_host (not a bare "/$1/", which nginx would
    # auto-prepend with $scheme://$host — $host drops a non-standard port
    # like the host-mapped 8080, redirecting browsers to port 80 instead).
    location ~ ^/([a-z0-9-]+)$ {
        if ($1 = admin) { return 404; }
        if ($1 = api) { return 404; }
        if ($1 = media) { return 404; }
        return 301 $scheme://$http_host/$1/;
    }

    # Canonicalize generated directory pages before serving them. Packaged
    # plugin assets use page-relative URLs, which require the browser URL to
    # end in `/` at every nesting depth (for example `/site/news/item/`).
    location ~ ^/([a-z0-9-]+)/(.*[^/])$ {
        set $site $1;
        set $relpath $2;
        if ($site = admin) { return 404; }
        if ($site = api) { return 404; }
        if ($site = media) { return 404; }
        if (-f /sites/$site/current/$relpath/index.html) {
            return 301 $scheme://$http_host/$site/$relpath/$is_args$args;
        }
        try_files /$site/current/$relpath =404;
    }

    # /{site-slug}/{...path} -> serve from the site's `current` release symlink
    location ~ ^/([a-z0-9-]+)/(.*)$ {
        set $site $1;
        set $relpath $2;
        if ($site = admin) { return 404; }
        if ($site = api) { return 404; }
        if ($site = media) { return 404; }
        try_files /$site/current/$relpath /$site/current/$relpath/index.html =404;
    }
}

# Domain-style access for local dev: http://{slug}.localhost:8080/ serves the
# same site as http://localhost:8080/{slug}/ but without the path prefix.
# *.localhost resolves to 127.0.0.1 in every modern browser/OS per RFC 6761 —
# no /etc/hosts edit needed. Matched by a separate server block (not folded
# into the one above) so it never competes with that block's own location
# regexes.
server {
    listen 80;
    server_name ~^(?<site_slug>[a-z0-9-]+)\.localhost$;
    root /sites;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = / {
        try_files /$site_slug/current/index.html =404;
    }

    # Apply the same trailing-slash canonicalization for domain-style access.
    location ~ ^/(.*[^/])$ {
        set $relpath $1;
        if ($site_slug = admin) { return 404; }
        if ($site_slug = api) { return 404; }
        if ($site_slug = media) { return 404; }
        if (-f /sites/$site_slug/current/$relpath/index.html) {
            return 301 $scheme://$http_host/$relpath/$is_args$args;
        }
        try_files /$site_slug/current/$relpath =404;
    }

    location ~ ^/(.*)$ {
        set $relpath $1;
        if ($site_slug = admin) { return 404; }
        if ($site_slug = api) { return 404; }
        if ($site_slug = media) { return 404; }
        try_files /$site_slug/current/$relpath /$site_slug/current/$relpath/index.html =404;
    }
}
