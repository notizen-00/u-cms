# Only forward Connection: upgrade when the client actually asked for one
# (real WebSocket handshake) — hardcoding "upgrade" unconditionally previously
# sent it on every plain HTTP request, which confused the SvelteKit adapter-node
# server into inconsistent per-route responses (some routes 401, others 404).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 81;
    server_name _;

    location / {
        proxy_pass http://dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
