services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unej_cms
      POSTGRES_PASSWORD: unej_cms
      POSTGRES_DB: unej_cms
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unej_cms -d unej_cms']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host port 6380: a pre-existing native Windows redis-server.exe (v3.0.504)
      # already occupies 6379 on this machine, unrelated to this project.
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    # Not gated behind a profile: MediaStorageService.onModuleInit (backend)
    # connects to MinIO unconditionally at boot (makeBucket/setBucketPolicy),
    # so `api`/`builder` crash-loop on startup if MinIO isn't running.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: unej_cms
      MINIO_ROOT_PASSWORD: unej_cms_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://unej_cms:unej_cms@postgres:5432/unej_cms
      REDIS_URL: redis://redis:6379
      SESSION_COOKIE_NAME: unej_cms_session
      SESSION_TTL_HOURS: '168'
      BUILD_OUTPUT_DIR: /sites
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: unej_cms
      MINIO_SECRET_KEY: unej_cms_secret
      MINIO_BUCKET: unej-cms-media
    ports:
      - '3000:3000'
    volumes:
      - site_output:/sites

  builder:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    command: ['sh', '-c', 'node dist/database/migrate.js && node dist/main-worker.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://unej_cms:unej_cms@postgres:5432/unej_cms
      REDIS_URL: redis://redis:6379
      BUILD_OUTPUT_DIR: /sites
    volumes:
      - site_output:/sites

  dashboard:
    build:
      context: ../apps/dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      # Adapter-node reads form actions before forwarding them to the API.
      # Covers Page Builder content and the existing 10 MB media upload.
      BODY_SIZE_LIMIT: 16M
      # SvelteKit adapter-node same-origin check for form actions; must match
      # the public URL the admin app is reached at (see nginx admin.conf below).
      ORIGIN: http://localhost:8081
      # Service name on the compose network, not the host-facing api port.
      PUBLIC_API_URL: http://api:3000
      # Host:port nginx's public static-site server listens on (host-facing,
      # since "Visit Site" links are opened by the admin's own browser).
      PUBLIC_SITE_HOST: localhost:8080

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - builder
      - dashboard
    ports:
      # Public static sites (built by `builder`, served from site_output).
      - '8080:80'
      # Admin dashboard, reverse-proxied separately from public sites per
      # docs/PRD-ADMIN.md §"Deployment".
      - '8081:81'
    volumes:
      - site_output:/sites:ro
      # Overwrites the image's own conf.d/default.conf (server_name localhost,
      # docroot /usr/share/nginx/html) — that stock file otherwise wins over
      # public.conf for any request with a "localhost" Host header, since
      # nginx prefers an exact server_name match over public.conf's `_`
      # catch-all regardless of file load order, silently 404-ing everything.
      - ./nginx/public.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/admin.conf:/etc/nginx/conf.d/admin.conf:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
  # Named volume (not a Windows bind mount): the atomic symlink deploy in
  # AtomicDeployService needs POSIX rename/symlink semantics from the Docker
  # Linux VM filesystem, which a bind mount onto NTFS cannot reliably provide.
  site_output:
